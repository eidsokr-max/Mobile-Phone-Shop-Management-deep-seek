<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج حسابات الكونتر</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="login-screen" class="screen active">
    <div class="login-box">
        <h1>🪵 برنامج حسابات الكونتر</h1>
        <input type="text" id="username" placeholder="اسم المستخدم" value="admin">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="login()">دخول</button>
        <p class="hint">الافتراضي: admin / admin123</p>
    </div>
</div>

<!-- الشاشة الرئيسية -->
<div id="main-screen" class="screen">
    <header>
        <h1>🪵 حسابات الكونتر</h1>
        <button onclick="logout()" class="btn-logout">خروج</button>
    </header>

    <nav class="main-nav">
        <button onclick="showPage('dashboard')" class="active">🏠 الرئيسية</button>
        <button onclick="showPage('products')">📦 الأصناف</button>
        <button onclick="showPage('purchases')">🛒 مشتريات</button>
        <button onclick="showPage('sales')">💰 مبيعات</button>
        <button onclick="showPage('customers')">👥 عملاء</button>
        <button onclick="showPage('suppliers')">🏭 موردون</button>
        <button onclick="showPage('cash')">💵 الخزينة</button>
        <button onclick="showPage('expenses')">📋 مصروفات</button>
        <button onclick="showPage('reports')">📊 تقارير</button>
    </nav>

    <main id="page-content">
        <!-- يتم تحميل المحتوى هنا -->
    </main>
</div>

<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script src="js/products.js"></script>
<script src="js/purchases.js"></script>
<script src="js/sales.js"></script>
<script src="js/customers.js"></script>
<script src="js/suppliers.js"></script>
<script src="js/cash.js"></script>
<script src="js/expenses.js"></script>
<script src="js/reports.js"></script>
<script src="js/backup.js"></script>
</body>
</html>
