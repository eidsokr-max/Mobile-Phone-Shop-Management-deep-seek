<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج كناش وإدارة المخزن</title>
    <!-- استخدام Tailwind CSS للتصميم السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 max-w-4xl">
        <!-- رأس التطبيق -->
        <header class="bg-blue-600 text-white p-4 rounded-xl shadow-md mb-6 flex justify-between items-center">
            <h1 class="text-xl font-bold">دفتر كناش وإدارة المخزن (MVP)</h1>
            <span id="current-date" class="text-sm bg-blue-700 px-3 py-1 rounded-lg"></span>
        </header>

        <!-- التنقل بين الأقسام -->
        <div class="flex gap-2 mb-6 bg-white p-2 rounded-xl shadow-sm">
            <button onclick="switchTab('inventory')" id="btn-inventory" class="flex-1 py-2 bg-blue-500 text-white rounded-lg font-semibold transition">المخزن والأصناف</button>
            <button onclick="switchTab('sales')" id="btn-sales" class="flex-1 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold transition">المبيعات (الكناش)</button>
        </div>

        <!-- قسم المخزن -->
        <div id="tab-inventory" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm">
                <h2 class="text-lg font-bold mb-3 text-blue-600">إضافة صنف جديد للمخزن</h2>
                <form id="item-form" class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" id="item-name" placeholder="اسم الصنف (مثل: كونتر ميز - أبيض)" required class="border p-2 rounded-lg">
                    <input type="number" id="item-qty" placeholder="الكمية" required class="border p-2 rounded-lg">
                    <input type="number" id="item-price" placeholder="سعر البيع" required class="border p-2 rounded-lg">
                    <button type="submit" class="bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700">إضافة للمخزن</button>
                </form>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm">
                <h2 class="text-lg font-bold mb-3">أرصدة المخزن الحالية</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="bg-gray-100 border-b">
                                <th class="p-2">الصنف</th>
                                <th class="p-2">الكمية المتاحة</th>
                                <th class="p-2">سعر البيع</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table-body">
                            <!-- سيتم تعبئتها ديناميكياً -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- قسم المبيعات والكناش -->
        <div id="tab-sales" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm">
                <h2 class="text-lg font-bold mb-3 text-blue-600">تسجيل عملية بيع (كناش العملاء)</h2>
                <form id="sale-form" class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" id="customer-name" placeholder="اسم العميل" required class="border p-2 rounded-lg">
                    <select id="sale-item-select" class="border p-2 rounded-lg" required>
                        <option value="">اختر الصنف</option>
                    </select>
                    <input type="number" id="sale-qty" placeholder="الكمية المباعة" required class="border p-2 rounded-lg">
                    <button type="submit" class="bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700">تسجيل وحساب</button>
                </form>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm">
                <h2 class="text-lg font-bold mb-3">سجل المبيعات والحركات</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="bg-gray-100 border-b">
                                <th class="p-2">العميل</th>
                                <th class="p-2">الصنف</th>
                                <th class="p-2">الكمية</th>
                                <th class="p-2">الإجمالي</th>
                                <th class="p-2">التاريخ</th>
                            </tr>
                        </thead>
                        <tbody id="sales-table-body">
                            <!-- سيتم تعبئتها ديناميكياً -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- جافاسكريبت للتشغيل والتخزين المحلي -->
    <script>
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('ar-EG');

        // البيانات المخزنة محلياً للاختبار السريع
        let inventory = JSON.parse(localStorage.getItem('inventory')) || [];
        let sales = JSON.parse(localStorage.getItem('sales')) || [];

        function switchTab(tab) {
            if(tab === 'inventory') {
                document.getElementById('tab-inventory').classList.remove('hidden');
                document.getElementById('tab-sales').classList.add('hidden');
                document.getElementById('btn-inventory').className = "flex-1 py-2 bg-blue-500 text-white rounded-lg font-semibold transition";
                document.getElementById('btn-sales').className = "flex-1 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold transition";
            } else {
                document.getElementById('tab-sales').classList.remove('hidden');
                document.getElementById('tab-inventory').classList.add('hidden');
                document.getElementById('btn-sales').className = "flex-1 py-2 bg-blue-500 text-white rounded-lg font-semibold transition";
                document.getElementById('btn-inventory').className = "flex-1 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold transition";
                updateSaleItemSelect();
            }
        }

        // إضافة صنف للمخزن
        document.getElementById('item-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('item-name').value;
            const qty = parseInt(document.getElementById('item-qty').value);
            const price = parseFloat(document.getElementById('item-price').value);

            inventory.push({ id: Date.now(), name, qty, price });
            localStorage.setItem('inventory', JSON.stringify(inventory));
            this.reset();
            renderInventory();
        });

        function renderInventory() {
            const tbody = document.getElementById('inventory-table-body');
            tbody.innerHTML = '';
            inventory.forEach(item => {
                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-2">${item.name}</td>
                        <td class="p-2 font-bold ${item.qty < 3 ? 'text-red-500' : 'text-green-600'}">${item.qty}</td>
                        <td class="p-2">${item.price} ج.م</td>
                    </tr>
                `;
            });
        }

        function updateSaleItemSelect() {
            const select = document.getElementById('sale-item-select');
            select.innerHTML = '<option value="">اختر الصنف</option>';
            inventory.forEach(item => {
                select.innerHTML += `<option value="${item.id}">${item.name} (المتاح: ${item.qty})</option>`;
            });
        }

        // تسجيل البيع
        document.getElementById('sale-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const customerName = document.getElementById('customer-name').value;
            const itemId = parseInt(document.getElementById('sale-item-select').value);
            const saleQty = parseInt(document.getElementById('sale-qty').value);

            const item = inventory.find(i => i.id === itemId);
            if (!item || item.qty < saleQty) {
                alert('الكمية المطلوبة غير متوفرة في المخزن!');
                return;
            }

            // خصم الكمية من المخزن
            item.qty -= saleQty;
            const total = saleQty * item.price;

            // تسجيل حركة البيع
            sales.push({
                customer: customerName,
                item: item.name,
                qty: saleQty,
                total: total,
                date: new Date().toLocaleDateString('ar-EG')
            });

            localStorage.setItem('inventory', JSON.stringify(inventory));
            localStorage.setItem('sales', JSON.stringify(sales));
            this.reset();
            renderInventory();
            renderSales();
        });

        function renderSales() {
            const tbody = document.getElementById('sales-table-body');
            tbody.innerHTML = '';
            sales.forEach(sale => {
                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-2">${sale.customer}</td>
                        <td class="p-2">${sale.item}</td>
                        <td class="p-2">${sale.qty}</td>
                        <td class="p-2 font-bold text-blue-600">${sale.total} ج.م</td>
                        <td class="p-2 text-sm text-gray-500">${sale.date}</td>
                    </tr>
                `;
            });
        }

        // التشغيل الأولي
        renderInventory();
        renderSales();
    </script>
</body>
</html>
