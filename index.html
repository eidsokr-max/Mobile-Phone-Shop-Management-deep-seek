<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8B4513">
<title>حسابات الكونتر</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f5f5f5;color:#333;direction:rtl;padding-bottom:70px}
.screen{display:none}
.screen.active{display:block}
#loading-screen{position:fixed;top:0;left:0;width:100%;height:100%;justify-content:center;align-items:center;background:linear-gradient(135deg,#8B4513,#D2691E);z-index:10000;flex-direction:column;color:#fff}
#loading-screen.hidden{display:none!important}
.spinner{width:50px;height:50px;border:4px solid rgba(255,255,255,.3);border-top:4px solid #fff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
@keyframes spin{to{transform:rotate(360deg)}}
#login-screen{position:fixed;top:0;left:0;width:100%;height:100%;justify-content:center;align-items:center;background:linear-gradient(135deg,#8B4513,#D2691E);z-index:9999}
#login-screen.hidden{display:none!important}
.login-box{background:#fff;padding:30px;border-radius:15px;width:90%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}
.login-box h1{color:#8B4513;margin-bottom:20px;font-size:1.3rem}
.login-box input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:1rem}
.login-box button{width:100%;padding:12px;background:#8B4513;color:#fff;border:none;border-radius:8px;font-size:1.1rem;cursor:pointer;margin-top:10px}
.login-box button:disabled{opacity:.6;cursor:not-allowed}
.err-msg{color:#dc3545;font-size:.85rem;margin-top:10px;min-height:20px}
#main-screen{display:none}
#main-screen.active{display:block}
header{background:#8B4513;color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
header h1{font-size:1rem}
.user-info{font-size:.75rem;opacity:.9;display:block;margin-top:2px}
.btn-logout{background:rgba(255,255,255,.2);color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:.85rem}
.main-nav{display:flex;overflow-x:auto;background:#fff;padding:5px;gap:5px;border-bottom:1px solid #ddd;position:sticky;top:52px;z-index:99}
.main-nav button{padding:8px 12px;border:none;background:#f0f0f0;border-radius:6px;white-space:nowrap;cursor:pointer;font-size:.85rem}
.main-nav button.active{background:#8B4513;color:#fff}
main{padding:15px;padding-bottom:90px}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:12px;box-shadow:0 2px 5px rgba(0,0,0,.05)}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px}
.stat-box{background:#fff;padding:15px;border-radius:10px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.05)}
.stat-box .label{font-size:.8rem;color:#666}
.stat-box .value{font-size:1.2rem;font-weight:bold;color:#8B4513;margin-top:5px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:.85rem}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid #eee}
th{background:#8B4513;color:#fff}
tr:hover{background:#f9f9f9}
.btn{padding:8px 12px;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;margin:2px}
.btn-primary{background:#8B4513;color:#fff}
.btn-success{background:#28a745;color:#fff}
.btn-danger{background:#dc3545;color:#fff}
.btn-secondary{background:#6c757d;color:#fff}
.btn-wa{background:#25D366;color:#fff}
.btn-sm{padding:4px 8px;font-size:.75rem}
.form-group{margin-bottom:12px}
.form-group label{display:block;margin-bottom:5px;font-size:.9rem;color:#555}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:.95rem}
.form-group .hint{font-size:.75rem;color:#999;margin-top:3px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;overflow-y:auto}
.modal.active{display:flex;align-items:center;justify-content:center;padding:10px}
.modal-content{background:#fff;padding:20px;border-radius:12px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-content h2{color:#8B4513;margin-bottom:15px;font-size:1.1rem}
.line{display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr auto;gap:5px;margin-bottom:5px;align-items:center;background:#f9f9f9;padding:5px;border-radius:8px}
.line select,.line input{padding:8px;border:1px solid #ddd;border-radius:6px;font-size:.85rem;width:100%}
.line .line-total{background:#fff3cd;color:#856404;font-weight:bold;text-align:center;padding:8px;border-radius:6px;font-size:.85rem}
.line button{padding:6px 8px;background:#dc3545;color:#fff;border:none;border-radius:6px;cursor:pointer}
.totals{background:#f9f9f9;padding:10px;border-radius:8px;margin:10px 0}
.totals div{display:flex;justify-content:space-between;padding:6px 0;font-size:.95rem;align-items:center}
.totals .big{font-size:1.2rem;font-weight:bold;color:#8B4513;border-top:2px solid #8B4513;padding-top:8px;margin-top:5px}
.empty{text-align:center;color:#999;padding:20px}
.invoice-view{background:#fff;padding:20px;border-radius:10px;font-size:.9rem}
.invoice-view .inv-header{text-align:center;border-bottom:2px solid #8B4513;padding-bottom:10px;margin-bottom:15px}
.invoice-view .inv-header h2{color:#8B4513;font-size:1.2rem}
.invoice-view .inv-meta{display:flex;justify-content:space-between;font-size:.85rem;color:#555;margin-bottom:15px;flex-wrap:wrap;gap:8px}
.invoice-view table{font-size:.85rem;margin-bottom:15px}
.search-box{margin-bottom:10px}
.search-box input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:.95rem}
.paid-row{display:flex;gap:5px;align-items:center}
.paid-row input{flex:1;padding:6px;text-align:center}
.btn-fill{background:#17a2b8;color:#fff;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:.75rem;white-space:nowrap}
.sync-status{position:fixed;bottom:10px;left:10px;background:#28a745;color:#fff;padding:6px 12px;border-radius:20px;font-size:.75rem;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:all .3s}
.sync-status.offline{background:#dc3545}
.sync-status.syncing{background:#ffc107;color:#333}

/* شاشة الفئات */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cat-card{background:linear-gradient(135deg,#fff9f0,#fff);border:2px solid #f0e0d0;border-radius:12px;padding:15px;cursor:pointer;transition:all .2s;text-align:center}
.cat-card:hover{border-color:#8B4513;transform:translateY(-2px);box-shadow:0 4px 12px rgba(139,69,19,.15)}
.cat-card .cat-icon{font-size:2rem;margin-bottom:8px}
.cat-card .cat-name{font-weight:bold;color:#8B4513;font-size:.95rem;margin-bottom:6px}
.cat-card .cat-count{font-size:.75rem;color:#999;background:#f5f5f5;padding:3px 8px;border-radius:10px;display:inline-block}

/* عرض الرصيد */
.stock-display{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.stock-main{font-weight:bold;color:#8B4513}
.stock-sub{font-size:.7rem;color:#999}

/* معلومات الصنف */
.product-info{font-size:.75rem;color:#666;margin-top:3px}
.unit-badge{display:inline-block;background:#e9ecef;padding:2px 6px;border-radius:4px;font-size:.7rem;color:#495057;margin-left:3px}

/* breadcrumb */
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:.85rem;color:#666}
.breadcrumb a{color:#8B4513;text-decoration:none;cursor:pointer}
.breadcrumb a:hover{text-decoration:underline}

@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;top:0;left:0;width:100%;padding:20px;background:#fff}
  .no-print{display:none!important}
}
@media(max-width:600px){
  table{font-size:.75rem}
  th,td{padding:6px 4px}
  .line{grid-template-columns:1fr 1fr;grid-template-areas:"p p" "q r" "t t";gap:4px}
  .line select{grid-area:p}
  .line .ln-q{grid-area:q}
  .line .ln-r{grid-area:r}
  .line .line-total{grid-area:t}
  .line button{grid-area:t;justify-self:end;margin-top:2px}
}
</style>
</head>
<body>

<!-- شاشة التحميل -->
<div id="loading-screen" style="display:flex">
  <div class="spinner"></div>
  <div>جاري التحميل...</div>
</div>

<!-- شاشة الدخول -->
<div id="login-screen" class="hidden">
  <div class="login-box">
    <h1>🪵 حسابات الكونتر</h1>
    <input type="email" id="login-email" placeholder="البريد الإلكتروني" autocomplete="email">
    <input type="password" id="login-password" placeholder="كلمة المرور" autocomplete="current-password">
    <button id="login-btn" onclick="doLogin()">دخول</button>
    <div class="err-msg" id="login-err"></div>
    <p style="color:#999;font-size:.75rem;margin-top:10px">سجّل بإيميلك المسجل في Firebase</p>
  </div>
</div>

<!-- الشاشة الرئيسية -->
<div id="main-screen">
  <header>
    <div>
      <h1>🪵 حسابات الكونتر</h1>
      <span class="user-info" id="user-email">...</span>
    </div>
    <button class="btn-logout" onclick="doLogout()">🚪 خروج</button>
  </header>

  <nav class="main-nav">
    <button data-page="dashboard" class="active" onclick="showPage('dashboard',this)">🏠 الرئيسية</button>
    <button data-page="categories" onclick="showPage('categories',this)">🗂️ الفئات</button>
    <button data-page="products" onclick="showPage('products',this)">📦 الأصناف</button>
    <button data-page="purchases" onclick="showPage('purchases',this)">🛒 مشتريات</button>
    <button data-page="sales" onclick="showPage('sales',this)">💰 مبيعات</button>
    <button data-page="customers" onclick="showPage('customers',this)">👥 عملاء</button>
    <button data-page="suppliers" onclick="showPage('suppliers',this)">🏭 موردون</button>
    <button data-page="cash" onclick="showPage('cash',this)">💵 الخزينة</button>
    <button data-page="expenses" onclick="showPage('expenses',this)">📋 مصروفات</button>
    <button data-page="reports" onclick="showPage('reports',this)">📊 تقارير</button>
    <button data-page="backup" onclick="showPage('backup',this)">💾 نسخ احتياطي</button>
  </nav>

  <main id="page-content"></main>
</div>

<!-- منطقة الطباعة -->
<div id="printArea" style="display:none"></div>

<!-- مؤشر المزامنة -->
<div id="syncIndicator" class="sync-status" style="display:none">☁️ متزامن</div>
<script type="module">
/* ============ Firebase ============ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, 
  onSnapshot, query, serverTimestamp, getDocs, where
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { 
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDz6zwskT2aamqjFJ-0G-xvXhWBXDnGIMo",
  authDomain: "konter-app-11714.firebaseapp.com",
  projectId: "konter-app-11714",
  storageBucket: "konter-app-11714.firebasestorage.app",
  messagingSenderId: "1050620984001",
  appId: "1:1050620984001:web:adfb27aa62fadf0b1eb240"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ============ أدوات ============ */
const fmt = n => Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2});
const today = () => new Date().toISOString().split('T')[0];
window.openModal = id => document.getElementById(id).classList.add('active');
window.closeModal = id => document.getElementById(id).classList.remove('active');

// القوائم
const UNITS = ['لوح','كرتونة','كيس','كيلو','متر','متر مربع','قطعة','طقم','دستة','باكو'];
window.UNITS = UNITS;

// البيانات
window.appData = { 
  categories: [], products: [], customers: [], suppliers: [], 
  purchases: [], sales: [], cash: [], expenses: [] 
};
window.listeners = [];
window.currentCategoryId = null; // للتنقل داخل الأصناف

// مؤشر المزامنة
function showSync(text, type='syncing'){
  const el = document.getElementById('syncIndicator');
  el.style.display = 'block';
  el.textContent = text;
  el.className = 'sync-status' + (type==='offline'?' offline':type==='syncing'?' syncing':'');
  if(type==='ok') setTimeout(()=>{ el.style.display='none'; }, 1500);
}
window.showSync = showSync;

/* ============ تسجيل الدخول ============ */
window.doLogin = async function(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-err');
  const btn = document.getElementById('login-btn');
  
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'أدخل الإيميل وكلمة المرور'; return; }
  
  btn.disabled = true;
  btn.textContent = 'جاري الدخول...';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e){
    console.error(e);
    let msg = 'خطأ في الدخول';
    if(e.code === 'auth/user-not-found') msg = 'الإيميل غير مسجل';
    else if(e.code === 'auth/wrong-password') msg = 'كلمة المرور خطأ';
    else if(e.code === 'auth/invalid-email') msg = 'الإيميل غير صحيح';
    else if(e.code === 'auth/invalid-credential') msg = 'بيانات الدخول خطأ';
    else if(e.code === 'auth/too-many-requests') msg = 'محاولات كثيرة، انتظر قليلاً';
    errEl.textContent = msg;
  } finally {
    btn.disabled = false;
    btn.textContent = 'دخول';
  }
};

window.doLogout = async function(){
  if(!confirm('تسجيل الخروج؟')) return;
  await signOut(auth);
};

/* ============ مراقبة الدخول ============ */
onAuthStateChanged(auth, async (user) => {
  const loadingEl = document.getElementById('loading-screen');
  const loginEl = document.getElementById('login-screen');
  const mainEl = document.getElementById('main-screen');
  
  loadingEl.classList.add('hidden');
  
  if(user){
    document.getElementById('user-email').textContent = user.email;
    loginEl.classList.add('hidden');
    mainEl.classList.add('active');
    await initRealtimeListeners();
    showPage('dashboard');
  } else {
    loginEl.classList.remove('hidden');
    mainEl.classList.remove('active');
    window.listeners.forEach(u => u());
    window.listeners = [];
  }
});

/* ============ المزامنة اللحظية ============ */
async function initRealtimeListeners(){
  showSync('☁️ جاري التحميل...', 'syncing');
  
  const collections = ['categories','products','customers','suppliers','purchases','sales','cash','expenses'];
  let loadedCount = 0;
  
  collections.forEach(colName => {
    const q = query(collection(db, colName));
    const unsub = onSnapshot(q, (snap) => {
      window.appData[colName] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      
      loadedCount++;
      if(loadedCount <= collections.length){
        showSync('☁️ متزامن', 'ok');
      }
      
      // إعادة رسم الصفحة الحالية
      const activePage = document.querySelector('.main-nav button.active');
      if(activePage){
        const pageName = activePage.dataset.page;
        if(pageName && window['render_'+pageName]){
          const content = document.getElementById('page-content');
          window['render_'+pageName](content);
        }
      }
    }, (err) => {
      console.error('Sync error:', colName, err);
      showSync('⚠️ خطأ في المزامنة', 'offline');
    });
    
    window.listeners.push(unsub);
  });
}

/* ============ العمليات على قاعدة البيانات ============ */
window.dbAdd = async function(colName, data){
  data.createdAt = serverTimestamp();
  data.updatedAt = serverTimestamp();
  const ref = await addDoc(collection(db, colName), data);
  return ref.id;
};

window.dbUpdate = async function(colName, id, data){
  data.updatedAt = serverTimestamp();
  await updateDoc(doc(db, colName, id), data);
};

window.dbDelete = async function(colName, id){
  await deleteDoc(doc(db, colName, id));
};

window.dbGetAll = function(colName){
  return window.appData[colName] || [];
};

window.dbGet = function(colName, id){
  return (window.appData[colName] || []).find(x => x.id === id);
};

window.genInvoiceNo = function(prefix, colName){
  const items = window.appData[colName] || [];
  let max = 0;
  items.forEach(i => {
    const m = (i.invoice_no || '').match(/(\d+)$/);
    if(m) max = Math.max(max, +m[1]);
  });
  return `${prefix}-${String(max+1).padStart(4,'0')}`;
};

/* ============ التنقل ============ */
window.showPage = async function(name, btn){
  document.querySelectorAll('.main-nav button').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  else document.querySelector(`.main-nav button[data-page="${name}"]`)?.classList.add('active');
  
  const c = document.getElementById('page-content');
  c.innerHTML = '<div class="card">جاري التحميل...</div>';
  try {
    const fn = window['render_'+name];
    if(fn) await fn(c);
    else c.innerHTML = '<div class="card">قيد التطوير</div>';
  } catch(e){
    c.innerHTML = '<div class="card" style="color:red">خطأ: '+e.message+'</div>';
    console.error(e);
  }
};

/* ============ لوحة التحكم ============ */
window.render_dashboard = async function(c){
  const products = dbGetAll('products');
  const sales = dbGetAll('sales');
  const purchases = dbGetAll('purchases');
  const cash = dbGetAll('cash');
  const customers = dbGetAll('customers');
  const suppliers = dbGetAll('suppliers');
  const categories = dbGetAll('categories');
  const t = today();
  
  const salesToday = sales.filter(s => s.invoice_date === t).reduce((a,s) => a + (s.total_amount||0), 0);
  const purToday = purchases.filter(p => p.invoice_date === t).reduce((a,p) => a + (p.total_amount||0), 0);
  const cashBalance = cash.reduce((a,x) => a + (x.trans_type==='in' ? (x.amount||0) : -(x.amount||0)), 0);
  const lowStock = products.filter(p => (p.current_stock||0) <= 0).length;
  const custDebt = customers.reduce((a,x) => a + (x.current_balance||0), 0);
  const supDebt = suppliers.reduce((a,x) => a + (x.current_balance||0), 0);
  const stockValue = products.reduce((a,p) => a + (p.current_stock||0) * (p.avg_cost||0), 0);

  c.innerHTML = `
    <div class="stats-grid">
      <div class="stat-box"><div class="label">رصيد الخزينة</div><div class="value">${fmt(cashBalance)}</div></div>
      <div class="stat-box"><div class="label">مبيعات اليوم</div><div class="value">${fmt(salesToday)}</div></div>
      <div class="stat-box"><div class="label">مشتريات اليوم</div><div class="value">${fmt(purToday)}</div></div>
      <div class="stat-box"><div class="label">قيمة المخزون</div><div class="value">${fmt(stockValue)}</div></div>
      <div class="stat-box"><div class="label">مديونية العملاء</div><div class="value">${fmt(custDebt)}</div></div>
      <div class="stat-box"><div class="label">مستحق للموردين</div><div class="value">${fmt(supDebt)}</div></div>
    </div>
    ${lowStock>0 ? `<div class="card" style="background:#fff3cd;color:#856404">⚠️ يوجد ${lowStock} صنف برصيد صفر أو سالب</div>` : ''}
    
    <div class="card">
      <h3 style="margin-bottom:10px;color:#8B4513">📊 ملخص عام</h3>
      <div style="padding:6px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-size:.9rem">
        <span>عدد الفئات</span><b>${categories.length}</b>
      </div>
      <div style="padding:6px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-size:.9rem">
        <span>عدد الأصناف</span><b>${products.length}</b>
      </div>
      <div style="padding:6px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-size:.9rem">
        <span>عدد العملاء</span><b>${customers.length}</b>
      </div>
      <div style="padding:6px 0;display:flex;justify-content:space-between;font-size:.9rem">
        <span>عدد الموردين</span><b>${suppliers.length}</b>
      </div>
    </div>
    
    <div class="card">
      <h3 style="margin-bottom:10px;color:#8B4513">آخر الحركات</h3>
      ${cash.slice(-10).reverse().map(x => `
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:.85rem">
          <span>${x.trans_date} - ${x.description||''}</span>
          <b style="color:${x.trans_type==='in'?'green':'red'}">${x.trans_type==='in'?'+':'-'}${fmt(x.amount)}</b>
        </div>`).join('') || '<div class="empty">لا حركات</div>'}
    </div>`;
};

/* ============ الفئات ============ */
window.render_categories = async function(c){
  const cats = dbGetAll('categories');
  const products = dbGetAll('products');
  
  c.innerHTML = `
    <div class="card"><button class="btn btn-primary" onclick="openCategoryModal()">➕ إضافة فئة</button></div>
    <div class="card">

function renderStockDisplay(p){
  const stock = p.current_stock || 0;
  const factor = p.conversion_factor || 1;
  if(factor <= 1){
    return `<div class="stock-display"><div class="stock-main">${fmt(stock)} ${p.unit_sell}</div></div>`;
  }
  const boxes = Math.floor(stock / factor);
  const remainder = stock - (boxes * factor);
  let sub = '';
  if(boxes > 0 && remainder > 0) sub = `≈ ${boxes} ${p.unit_buy} + ${remainder} ${p.unit_sell}`;
  else if(boxes > 0) sub = `≈ ${boxes} ${p.unit_buy}`;
  else if(remainder > 0) sub = `أقل من ${p.unit_buy} واحد`;
  return `<div class="stock-display">
    <div class="stock-main">${fmt(stock)} ${p.unit_sell}</div>
    ${sub ? `<div class="stock-sub">${sub}</div>` : ''}
  </div>`;
}

  const cats = dbGetAll('categories');

  document.getElementById('productTitle').textContent = 'إضافة صنف';

  document.getElementById('p_unit_sell').value = 'لوح';
  document.getElementById('p_factor').value = 1;
  document.getElementById('p_pp').value = 0;
  document.getElementById('p_sp').value = 0;
  
  // Event listeners للتحديث التلقائي
  document.getElementById('p_unit_buy').onchange = updateConversionHint;
  document.getElementById('p_unit_sell').onchange = updateConversionHint;
  
  updateConversionHint();
  openModal('productModal');
};

window.updateConversionHint = function(){
  const ub = document.getElementById('p_unit_buy').value;
  const us = document.getElementById('p_unit_sell').value;
  const sameUnit = ub === us;
  
  const factorGroup = document.getElementById('factor_group');
  if(sameUnit){
    factorGroup.style.display = 'none';
    document.getElementById('p_factor').value = 1;
  } else {
    factorGroup.style.display = 'block';
    document.getElementById('factor_unit_sell').textContent = us;
    document.getElementById('factor_unit_buy').textContent = ub;
  }
  
  document.getElementById('label_unit_buy').textContent = ub;
  document.getElementById('label_unit_sell').textContent = us;
};

window.saveProduct = async function(){
  const id = document.getElementById('p_id').value;
  const category_id = document.getElementById('p_cat').value;
  const name = document.getElementById('p_name').value.trim();
  const unit_buy = document.getElementById('p_unit_buy').value;
  const unit_sell = document.getElementById('p_unit_sell').value;
  let factor = +document.getElementById('p_factor').value || 1;
  const pp = +document.getElementById('p_pp').value || 0;
  const sp = +document.getElementById('p_sp').value || 0;
  
  if(!name){ alert('اسم الصنف مطلوب'); return; }
  if(unit_buy === unit_sell) factor = 1;
  if(unit_buy !== unit_sell && factor < 1){ alert('معامل التحويل يجب أن يكون 1 على الأقل'); return; }
  
  const data = {
    category_id, name, unit_buy, unit_sell,
    conversion_factor: factor,
    purchase_price: pp,
    sale_price: sp
  };
  
  showSync('☁️ جاري الحفظ...', 'syncing');
  if(id){
    await dbUpdate('products', id, data);
  } else {
    data.current_stock = 0;
    data.avg_cost = pp / factor; // متوسط تكلفة الوحدة الصغيرة
    await dbAdd('products', data);
  }
  showSync('✅ تم الحفظ', 'ok');
  closeModal('productModal');
};

window.delProduct = async function(id){
  if(!confirm('حذف الصنف؟')) return;
  showSync('☁️ جاري الحذف...', 'syncing');
  await dbDelete('products', id);
  showSync('✅ تم الحذف', 'ok');
};

window.calcPurchaseTot = function(){

  document.querySelectorAll('.pu-line').forEach(l => {
    const q = +l.querySelector('.ln-q').value || 0;

    l.querySelector('.line-total').textContent = fmt(lt);
    t += lt;
  });
  const totalEl = document.getElementById('pu_total');
  totalEl.textContent = fmt(t);
  totalEl.dataset.raw = t;
  const paidInput = document.getElementById('pu_paid');
  if(paidInput.dataset.auto === '1') paidInput.value = t;
  calcPurchaseRem();
};

window.savePurchase = async function(){
  const sid = document.getElementById('pu_sup').value;
  const d = document.getElementById('pu_date').value;
  if(!sid){ alert('اختر المورد'); return; }
  
  const lines = [];
  document.querySelectorAll('.pu-line').forEach(l => {
    const pid = l.querySelector('.ln-p').value;
    const q = +l.querySelector('.ln-q').value;
    const r = +l.querySelector('.ln-r').value;
    if(pid && q > 0) lines.push({ product_id: pid, quantity: q, unit_price: r, total: q*r });
  });
  if(!lines.length){ alert('أضف أصنافاً'); return; }
  
  const total = lines.reduce((a,l) => a + l.total, 0);
  const paid = +document.getElementById('pu_paid').value || 0;
  const rem = total - paid;
  const inv = document.getElementById('pu_no').value;
  const supplier = dbGet('suppliers', sid);
  
  showSync('☁️ جاري الحفظ...', 'syncing');
  
  // نجهز الـ items مع الوحدات والتحويل
  const itemsData = [];
  for(const l of lines){
    const p = dbGet('products', l.product_id);
    if(!p) continue;
    itemsData.push({
      product_id: l.product_id,
      quantity: l.quantity,
      unit: p.unit_buy || 'وحدة',
      unit_price: l.unit_price,
      total: l.total,
      conversion_factor: p.conversion_factor || 1,
      unit_sell: p.unit_sell || 'وحدة'
    });
  }
  
  await dbAdd('purchases', {
    invoice_no: inv, invoice_date: d, supplier_id: sid,
    supplier_name: supplier?.name || '',
    total_amount: total, paid_amount: paid, remaining: rem,
    items: itemsData
  });
  
  // تحديث المخزون ومتوسط التكلفة
  for(const l of lines){
    const p = dbGet('products', l.product_id);
    if(!p) continue;
    const factor = p.conversion_factor || 1;
    const qtyInSmallUnit = l.quantity * factor; // تحويل للوحدة الصغيرة
    const costPerSmallUnit = l.unit_price / factor;
    
    const oldStock = p.current_stock || 0;
    const oldValue = oldStock * (p.avg_cost || 0);
    const newValue = qtyInSmallUnit * costPerSmallUnit;
    const ns = oldStock + qtyInSmallUnit;
    const newAvg = ns > 0 ? (oldValue + newValue) / ns : costPerSmallUnit;
    
    await dbUpdate('products', p.id, {
      current_stock: ns,
      avg_cost: newAvg,
      purchase_price: l.unit_price
    });
  }
  
  if(supplier){
    await dbUpdate('suppliers', sid, {
      current_balance: (supplier.current_balance||0) + rem
    });
  }
  
  if(paid > 0){
    await dbAdd('cash', {
      trans_date: d, trans_type: 'out', amount: paid,
      source: 'مشتريات', reference: inv,
      description: 'دفعة شراء ' + inv
    });
  }
  
  showSync('✅ تم الحفظ', 'ok');
  closeModal('purchaseModal');
};

window.delPurchase = async function(id){
  if(!confirm('حذف الفاتورة؟ (لن يتم استرجاع المخزون)')) return;

window.addSaleLine = function(){
  const products = dbGetAll('products');
  const div = document.createElement('div');
  div.className = 'line sa-line';
  div.innerHTML = `
    <select class="ln-p" onchange="autoSalePrice(this)">
      <option value="">-- اختر الصنف --</option>
      ${products.map(p => {
        const cat = dbGet('categories', p.category_id);
        const label = (cat ? cat.name + ' - ' : '') + p.name + ` [${fmt(p.current_stock||0)} ${p.unit_sell}]`;
        return `<option value="${p.id}" data-sp="${p.sale_price||0}" data-st="${p.current_stock||0}" data-us="${p.unit_sell||''}" data-f="${p.conversion_factor||1}">${label}</option>`;
      }).join('')}
    </select>
    <input type="number" class="ln-q" placeholder="كمية" oninput="calcSaleTot()">
    <input type="number" class="ln-r" placeholder="سعر" oninput="calcSaleTot()">
    <div class="line-total">0</div>
    <button onclick="this.parentElement.remove();calcSaleTot()">✖</button>`;
  document.getElementById('sa_lines').appendChild(div);
};

window.autoSalePrice = function(sel){
  const opt = sel.options[sel.selectedIndex];
  const sp = opt?.dataset.sp || 0;
  const us = opt?.dataset.us || '';
  const line = sel.parentElement;
  line.querySelector('.ln-r').value = sp;
  line.querySelector('.ln-r').placeholder = `سعر ${us}`;
  calcSaleTot();
};

window.calcSaleTot = function(){
  let t = 0;
  document.querySelectorAll('.sa-line').forEach(l => {
    const q = +l.querySelector('.ln-q').value || 0;
    const r = +l.querySelector('.ln-r').value || 0;
    const lt = q * r;
    l.querySelector('.line-total').textContent = fmt(lt);
    t += lt;
  });
  const totalEl = document.getElementById('sa_total');
  totalEl.textContent = fmt(t);
  totalEl.dataset.raw = t;
  const paidInput = document.getElementById('sa_paid');
  if(paidInput.dataset.auto === '1') paidInput.value = t;
  calcSaleRem();
};

window.calcSaleRem = function(manual){
  const t = +document.getElementById('sa_total').dataset.raw || 0;
  const p = +document.getElementById('sa_paid').value || 0;
  if(manual) document.getElementById('sa_paid').dataset.auto = '0';
  document.getElementById('sa_rem').textContent = fmt(t - p);
};

window.fillSalePaid = function(){
  const t = +document.getElementById('sa_total').dataset.raw || 0;
  document.getElementById('sa_paid').value = t;
  document.getElementById('sa_paid').dataset.auto = '1';
  calcSaleRem();
};

window.saveSale = async function(){
  const cid = document.getElementById('sa_cus').value;
  const d = document.getElementById('sa_date').value;
  if(!cid){ alert('اختر العميل'); return; }
  
  const lines = [];
  let err = false;
  document.querySelectorAll('.sa-line').forEach(l => {
    const pid = l.querySelector('.ln-p').value;
    const q = +l.querySelector('.ln-q').value;
    const r = +l.querySelector('.ln-r').value;
    if(pid && q > 0) lines.push({ product_id: pid, quantity: q, unit_price: r, total: q*r });
  });
  if(!lines.length){ alert('أضف أصنافاً'); return; }
  
  // تحقق من الرصيد
  for(const l of lines){
    const p = dbGet('products', l.product_id);
    if(!p || (p.current_stock||0) < l.quantity){
      alert(`الرصيد غير كافٍ: ${p?.name||''} (متاح ${fmt(p?.current_stock||0)} ${p?.unit_sell||''})`);
      err = true; break;
    }
  }
  if(err) return;
  
  const total = lines.reduce((a,l) => a + l.total, 0);
  const paid = +document.getElementById('sa_paid').value || 0;
  const rem = total - paid;
  const inv = document.getElementById('sa_no').value;
  const customer = dbGet('customers', cid);
  
  const itemsWithCost = lines.map(l => {
    const p = dbGet('products', l.product_id);
    const cost = p?.avg_cost || 0;
    return { 
      ...l, 
      unit: p?.unit_sell || 'وحدة',
      cost_price: cost, 
      profit: (l.unit_price - cost) * l.quantity 
    };
  });
  
  showSync('☁️ جاري الحفظ...', 'syncing');
  
  await dbAdd('sales', {
    invoice_no: inv, invoice_date: d, customer_id: cid,
    customer_name: customer?.name || '',
    total_amount: total, paid_amount: paid, remaining: rem,
    items: itemsWithCost
  });
  
  // خصم من المخزون (الوحدة الصغيرة)
  for(const l of lines){
    const p = dbGet('products', l.product_id);
    if(p){
      await dbUpdate('products', p.id, {
        current_stock: (p.current_stock||0) - l.quantity
      });
    }
  }
  
  if(customer){
    await dbUpdate('customers', cid, {
      current_balance: (customer.current_balance||0) + rem
    });
  }
  
  if(paid > 0){
    await dbAdd('cash', {
      trans_date: d, trans_type: 'in', amount: paid,
      source: 'مبيعات', reference: inv,
      description: 'تحصيل بيع ' + inv
    });
  }
  
  showSync('✅ تم الحفظ', 'ok');
  closeModal('saleModal');
};

};

};

/* ============ التقارير ============ */
window.render_reports = async function(c){
  const products = dbGetAll('products');
  const sales = dbGetAll('sales');
  const expenses = dbGetAll('expenses');
  const customers = dbGetAll('customers');
  const suppliers = dbGetAll('suppliers');
  const categories = dbGetAll('categories');
  
  let grossProfit = 0, totalSales = 0, cogs = 0;
  sales.forEach(s => (s.items||[]).forEach(i => {
    grossProfit += i.profit||0;
    cogs += (i.cost_price||0) * i.quantity;
    totalSales += i.total;
  }));
  const totalExp = expenses.reduce((a,x) => a + x.amount, 0);
  const netProfit = grossProfit - totalExp;
  const stockValue = products.reduce((a,p) => a + (p.current_stock||0) * (p.avg_cost||0), 0);
  
  // تقرير لكل فئة
  let catReport = '';
  for(const cat of categories){
    const catProducts = products.filter(p => p.category_id === cat.id);
    const catStock = catProducts.reduce((a,p) => a + (p.current_stock||0) * (p.avg_cost||0), 0);
    const catSales = sales.filter(s => (s.items||[]).some(i => catProducts.some(p => p.id === i.product_id)));
    const catSalesVal = catSales.reduce((a,s) => a + (s.items||[]).filter(i => catProducts.some(p => p.id === i.product_id)).reduce((x,i) => x + i.total, 0), 0);
    
    catReport += `
      <div style="padding:8px 0;border-bottom:1px solid #eee;font-size:.85rem">
        <div style="display:flex;justify-content:space-between">
          <b>🗂️ ${cat.name}</b>
          <span>${catProducts.length} صنف</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:.75rem;color:#666;margin-top:4px">
          <span>قيمة مخزون: ${fmt(catStock)}</span>
          <span>مبيعات: ${fmt(catSalesVal)}</span>
        </div>
      </div>`;
  }
  
  c.innerHTML = `
    <div class="card">
      <h3 style="color:#8B4513;margin-bottom:10px">📊 الملخص العام</h3>
      <div style="padding:6px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between"><span>إجمالي المبيعات</span><b>${fmt(totalSales)}</b></div>
      <div style="padding:6px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between"><span>تكلفة المبيعات</span><b>${fmt(cogs)}</b></div>
      <div style="padding:6px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between"><span>الربح الإجمالي</span><b style="color:green">${fmt(grossProfit)}</b></div>
      <div style="padding:6px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between"><span>إجمالي المصروفات</span><b style="color:red">${fmt(totalExp)}</b></div>
      <div style="padding:6px 0;display:flex;justify-content:space-between"><span><b>صافي الربح</b></span><b style="color:${netProfit>=0?'green':'red'};font-size:1.1rem">${fmt(netProfit)}</b></div>
    </div>
    
    <div class="card">
      <h3 style="color:#8B4513;margin-bottom:10px">🗂️ تقرير الفئات</h3>
      ${catReport || '<div class="empty">لا فئات</div>'}
    </div>
    
    <div class="card">
      <h3 style="color:#8B4513;margin-bottom:10px">📦 قيمة المخزون: ${fmt(stockValue)}</h3>
      <table>
        <thead><tr><th>الصنف</th><th>الرصيد</th><th>القيمة</th></tr></thead>
        <tbody>
          ${products.length===0 ? '<tr><td colspan="3" class="empty">لا أصناف</td></tr>' :
            products.map(p => {
              const stock = renderStockDisplay(p);
              return `<tr>
                <td>${p.name}</td>
                <td>${stock}</td>
                <td>${fmt((p.current_stock||0)*(p.avg_cost||0))}</td>
              </tr>`;
            }).join('')}
        </tbody>
      </table>
    </div>
    
    <div class="card">
      <h3 style="color:#8B4513;margin-bottom:10px">👥 مديونيات العملاء</h3>
      ${customers.filter(x => (x.current_balance||0) > 0).length===0 ? '<div class="empty">لا مديونيات</div>' :
        customers.filter(x => (x.current_balance||0) > 0).map(x => `<div style="padding:6px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between">
          <span>${x.name}</span><b style="color:red">${fmt(x.current_balance)}</b></div>`).join('')}
    </div>
    
    <div class="card">
      <h3 style="color:#8B4513;margin-bottom:10px">🏭 مستحقات الموردين</h3>
      ${suppliers.filter(x => (x.current_balance||0) > 0).length===0 ? '<div class="empty">لا مستحقات</div>' :
        suppliers.filter(x => (x.current_balance||0) > 0).map(x => `<div style="padding:6px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between">
          <span>${x.name}</span><b style="color:red">${fmt(x.current_balance)}</b></div>`).join('')}
    </div>`;
};

/* ============ النسخ الاحتياطي ============ */
window.render_backup = async function(c){
  c.innerHTML = `
    <div class="card">
      <h3 style="color:#8B4513;margin-bottom:10px">💾 نسخ احتياطي</h3>
      <p style="font-size:.9rem;color:#666;margin-bottom:10px">حمّل ملف JSON به كل بياناتك من Firebase.</p>
      <button class="btn btn-primary" onclick="exportData()">⬇️ تصدير البيانات</button>
    </div>
    <div class="card">
      <h3 style="color:#8B4513;margin-bottom:10px">📤 استيراد</h3>
      <p style="font-size:.9rem;color:#666;margin-bottom:10px">ارفع ملف JSON لإضافة بيانات جديدة إلى Firebase.</p>
      <input type="file" id="importFile" accept=".json" style="margin-bottom:10px">
      <button class="btn btn-success" onclick="importData()">⬆️ استيراد</button>
    </div>`;
};

window.exportData = async function(){
  const data = { _meta: { exported_at: new Date().toISOString(), version: 2 } };
  ['categories','products','customers','suppliers','purchases','sales','cash','expenses'].forEach(k => {
    data[k] = dbGetAll(k);
  });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'konter-backup-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(url);
};

window.importData = async function(){
  const f = document.getElementById('importFile').files[0];
  if(!f){ alert('اختر ملفاً'); return; }
  if(!confirm('سيتم إضافة البيانات من الملف إلى Firebase. متأكد؟')) return;
  const text = await f.text();
  const data = JSON.parse(text);
  showSync('☁️ جاري الاستيراد...', 'syncing');
  let count = 0;
  for(const k of ['categories','products','customers','suppliers','purchases','sales','cash','expenses']){
    if(data[k] && Array.isArray(data[k])){
      for(const it of data[k]){
        const { id, ...rest } = it;
        await dbAdd(k, rest);
        count++;
      }
    }
  }
  showSync('✅ تم استيراد ' + count + ' سجل', 'ok');
  alert('تم استيراد ' + count + ' سجل بنجاح');
};
</script>
