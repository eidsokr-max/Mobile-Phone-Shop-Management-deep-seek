<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8B4513">
<title>حسابات الكونتر - محاسبي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f5f5f5;color:#333;direction:rtl;padding-bottom:70px}
.screen{display:none}
.screen.active{display:block}
#loading-screen{position:fixed;top:0;left:0;width:100%;height:100%;justify-content:center;align-items:center;background:linear-gradient(135deg,#8B4513,#D2691E);z-index:10000;flex-direction:column;color:#fff}
#loading-screen.hidden{display:none!important}
.spinner{width:50px;height:50px;border:4px solid rgba(255,255,255,.3);border-top:4px solid #fff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
@keyframes spin{to{transform:rotate(360deg)}}
#login-screen{position:fixed;top:0;left:0;width:100%;height:100%;justify-content:center;align-items:center;background:linear-gradient(135deg,#8B4513,#D2691E);z-index:9999}
#login-screen.hidden{display:none!important}
.login-box{background:#fff;padding:30px;border-radius:15px;width:90%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}
.login-box h1{color:#8B4513;margin-bottom:20px;font-size:1.3rem}
.login-box input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:1rem}
.login-box button{width:100%;padding:12px;background:#8B4513;color:#fff;border:none;border-radius:8px;font-size:1.1rem;cursor:pointer;margin-top:10px}
.login-box button:disabled{opacity:.6;cursor:not-allowed}
.err-msg{color:#dc3545;font-size:.85rem;margin-top:10px;min-height:20px}
#main-screen{display:none}
#main-screen.active{display:block}
header{background:#8B4513;color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
header h1{font-size:1rem}
.user-info{font-size:.75rem;opacity:.9;display:block;margin-top:2px}
.btn-logout{background:rgba(255,255,255,.2);color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:.85rem}
.main-nav{display:flex;flex-wrap:wrap;background:#fff;padding:5px;gap:4px;border-bottom:1px solid #ddd;position:sticky;top:52px;z-index:99;justify-content:center}
.main-nav button{padding:6px 10px;border:none;background:#f0f0f0;border-radius:6px;white-space:nowrap;cursor:pointer;font-size:.78rem;flex:0 0 auto}
.main-nav button.active{background:#8B4513;color:#fff}
main{padding:15px;padding-bottom:90px}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:12px;box-shadow:0 2px 5px rgba(0,0,0,.05)}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px}
.stat-box{background:#fff;padding:15px;border-radius:10px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.05)}
.stat-box .label{font-size:.8rem;color:#666}
.stat-box .value{font-size:1.2rem;font-weight:bold;color:#8B4513;margin-top:5px}
.stat-box.income .value{color:#28a745}
.stat-box.expense .value{color:#dc3545}
.stat-box.warning .value{color:#ffc107}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:.85rem}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid #eee}
th{background:#8B4513;color:#fff}
tr:hover{background:#f9f9f9}
.btn{padding:8px 12px;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;margin:2px}
.btn-primary{background:#8B4513;color:#fff}
.btn-success{background:#28a745;color:#fff}
.btn-danger{background:#dc3545;color:#fff}
.btn-secondary{background:#6c757d;color:#fff}
.btn-wa{background:#25D366;color:#fff}
.btn-info{background:#17a2b8;color:#fff}
.btn-warning{background:#ffc107;color:#333}
.btn-sm{padding:4px 8px;font-size:.75rem}
.actions-cell{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.actions-cell .btn{padding:6px 8px;font-size:.8rem;min-width:36px;text-align:center}
.form-group{margin-bottom:12px}
.form-group label{display:block;margin-bottom:5px;font-size:.9rem;color:#555}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:.95rem}
.form-group .hint{font-size:.75rem;color:#999;margin-top:3px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;overflow-y:auto}
.modal.active{display:flex;align-items:center;justify-content:center;padding:10px}
.modal-content{background:#fff;padding:20px;border-radius:12px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-content h2{color:#8B4513;margin-bottom:15px;font-size:1.1rem}
.line{display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr auto;gap:5px;margin-bottom:5px;align-items:center;background:#f9f9f9;padding:5px;border-radius:8px}
.line select,.line input{padding:8px;border:1px solid #ddd;border-radius:6px;font-size:.85rem;width:100%}
.line .line-total{background:#fff3cd;color:#856404;font-weight:bold;text-align:center;padding:8px;border-radius:6px;font-size:.85rem}
.line button{padding:6px 8px;background:#dc3545;color:#fff;border:none;border-radius:6px;cursor:pointer}
.totals{background:#f9f9f9;padding:10px;border-radius:8px;margin:10px 0}
.totals div{display:flex;justify-content:space-between;padding:6px 0;font-size:.95rem;align-items:center}
.totals .big{font-size:1.2rem;font-weight:bold;color:#8B4513;border-top:2px solid #8B4513;padding-top:8px;margin-top:5px}
.empty{text-align:center;color:#999;padding:20px}
.invoice-view{background:#fff;padding:20px;border-radius:10px;font-size:.9rem}
.invoice-view .inv-header{text-align:center;border-bottom:2px solid #8B4513;padding-bottom:10px;margin-bottom:15px}
.invoice-view .inv-header h2{color:#8B4513;font-size:1.2rem}
.invoice-view .inv-meta{display:flex;justify-content:space-between;font-size:.85rem;color:#555;margin-bottom:15px;flex-wrap:wrap;gap:8px}
.invoice-view table{font-size:.85rem;margin-bottom:15px}
.search-box{margin-bottom:10px}
.search-box input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:.95rem}
.paid-row{display:flex;gap:5px;align-items:center}
.paid-row input{flex:1;padding:6px;text-align:center}
.btn-fill{background:#17a2b8;color:#fff;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:.75rem;white-space:nowrap}
.sync-status{position:fixed;bottom:10px;left:10px;background:#28a745;color:#fff;padding:6px 12px;border-radius:20px;font-size:.75rem;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:all .3s}
.sync-status.offline{background:#dc3545}
.sync-status.syncing{background:#ffc107;color:#333}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cat-card{background:linear-gradient(135deg,#fff9f0,#fff);border:2px solid #f0e0d0;border-radius:12px;padding:15px;cursor:pointer;transition:all .2s;text-align:center}
.cat-card:hover{border-color:#8B4513;transform:translateY(-2px);box-shadow:0 4px 12px rgba(139,69,19,.15)}
.cat-card .cat-icon{font-size:2rem;margin-bottom:8px}
.cat-card .cat-name{font-weight:bold;color:#8B4513;font-size:.95rem;margin-bottom:6px}
.cat-card .cat-count{font-size:.75rem;color:#999;background:#f5f5f5;padding:3px 8px;border-radius:10px;display:inline-block}
.stock-display{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.stock-main{font-weight:bold;color:#8B4513}
.stock-sub{font-size:.7rem;color:#999}
.product-info{font-size:.75rem;color:#666;margin-top:3px}
.unit-badge{display:inline-block;background:#e9ecef;padding:2px 6px;border-radius:4px;font-size:.7rem;color:#495057;margin-left:3px}
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:.85rem;color:#666}
.breadcrumb a{color:#8B4513;text-decoration:none;cursor:pointer}
.breadcrumb a:hover{text-decoration:underline}
.balance-box{background:linear-gradient(135deg,#8B4513,#D2691E);color:#fff;padding:20px;border-radius:12px;text-align:center;margin-bottom:15px}
.balance-box .balance-label{font-size:.85rem;opacity:.9}
.balance-box .balance-value{font-size:2rem;font-weight:bold;margin-top:5px}
.balance-box .balance-type{font-size:.75rem;opacity:.8;margin-top:5px}
.action-buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:15px}
.action-buttons button{padding:12px 8px;font-size:.8rem;font-weight:bold}
.tx-type-badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:.7rem;font-weight:bold}
.tx-sale{background:#d1ecf1;color:#0c5460}
.tx-payment{background:#d4edda;color:#155724}
.tx-debt{background:#f8d7da;color:#721c24}
.tx-adjustment{background:#fff3cd;color:#856404}
.tx-purchase{background:#e2e3e5;color:#383d41}
.edit-badge{background:#ffe5b4;color:#8B4513;padding:2px 8px;border-radius:4px;font-size:.7rem;display:inline-block;margin-top:4px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid #8B4513}
.section-title h3{color:#8B4513;font-size:.95rem}
.section-title a{color:#8B4513;font-size:.8rem;cursor:pointer;text-decoration:none}
.section-title a:hover{text-decoration:underline}
.invoice-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:.85rem}
.invoice-row:last-child{border-bottom:none}
.invoice-row .inv-no{color:#8B4513;font-weight:bold}
.invoice-row .inv-info{color:#666;font-size:.75rem}
.invoice-row .inv-amount{font-weight:bold;color:#333}
.danger-zone{border:2px solid #dc3545;background:#fff5f5}
.danger-zone h3{color:#dc3545;margin-bottom:10px}
.danger-btn{background:#dc3545;color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;font-size:.9rem;width:100%;margin-bottom:8px;text-align:right;font-weight:bold}
.danger-btn:hover{background:#c82333}
.danger-btn-final{background:#8B0000;color:#fff;border:2px solid #000;padding:15px;font-size:1rem}
.journal-entry{background:#fff;border-radius:10px;margin-bottom:10px;box-shadow:0 2px 5px rgba(0,0,0,.05);overflow:hidden}
.journal-entry .je-header{background:#8B4513;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
.journal-entry .je-header .je-num{font-weight:bold}
.journal-entry .je-body{padding:10px 12px}
.journal-entry .je-line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #eee;font-size:.8rem}
.journal-entry .je-line:last-child{border-bottom:none}
.journal-entry .je-line .je-account{flex:2;color:#333}
.journal-entry .je-line .je-amount{flex:1;text-align:left;font-weight:bold}
.journal-entry .je-line .debit{color:#28a745}
.journal-entry .je-line .credit{color:#dc3545}
.journal-entry .je-footer{padding:8px 12px;background:#f9f9f9;font-size:.75rem;color:#666;text-align:center;border-top:1px solid #eee}
.balance-check{text-align:center;padding:8px;border-radius:6px;font-size:.8rem;font-weight:bold;margin-top:8px}
.balance-check.ok{background:#d4edda;color:#155724}
.balance-check.bad{background:#f8d7da;color:#721c24}
.account-item{padding:8px 10px;border-bottom:1px solid #eee;font-size:.85rem;display:flex;justify-content:space-between}
.account-item:last-child{border-bottom:none}
.account-item .acc-code{color:#8B4513;font-weight:bold;margin-left:8px}
.account-item .acc-balance{font-weight:bold}
.account-item.debit .acc-balance{color:#28a745}
.account-item.credit .acc-balance{color:#dc3545}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;top:0;left:0;width:100%;padding:20px;background:#fff}
  .no-print{display:none!important}
}
@media(max-width:600px){
  table{font-size:.75rem}
  th,td{padding:6px 4px}
  .line{grid-template-columns:1fr 1fr;grid-template-areas:"p p" "q r" "t t";gap:4px}
  .line select{grid-area:p}
  .line .ln-q{grid-area:q}
  .line .ln-r{grid-area:r}
  .line .line-total{grid-area:t}
  .line button{grid-area:t;justify-self:end;margin-top:2px}
  .action-buttons{grid-template-columns:1fr}
  .actions-cell .btn{padding:5px 6px;font-size:.75rem;min-width:30px}
  .main-nav button{padding:5px 8px;font-size:.72rem}
  .main-nav{gap:3px;padding:4px}
}
</style>
</head>
<body>

<div id="loading-screen" style="display:flex">
  <div class="spinner"></div>
  <div>جاري التحميل...</div>
</div>

<div id="login-screen" class="hidden">
  <div class="login-box">
    <h1>🪵 حسابات الكونتر</h1>
    <input type="email" id="login-email" placeholder="البريد الإلكتروني" autocomplete="email">
    <input type="password" id="login-password" placeholder="كلمة المرور" autocomplete="current-password">
    <button id="login-btn" onclick="doLogin()">دخول</button>
    <div class="err-msg" id="login-err"></div>
    <p style="color:#999;font-size:.75rem;margin-top:10px">سجّل بإيميلك المسجل في Firebase</p>
  </div>
</div>

<div id="main-screen">
  <header>
    <div>
      <h1>🪵 حسابات الكونتر</h1>
      <span class="user-info" id="user-email">...</span>
    </div>
    <button class="btn-logout" onclick="doLogout()">🚪 خروج</button>
  </header>

  <nav class="main-nav">
    <button data-page="dashboard" class="active" onclick="showPage('dashboard',this)">🏠 الرئيسية</button>
    <button data-page="categories" onclick="showPage('categories',this)">🗂️ الفئات</button>
    <button data-page="products" onclick="showPage('products',this)">📦 الأصناف</button>
    <button data-page="purchases" onclick="showPage('purchases',this)">🛒 مشتريات</button>
    <button data-page="sales" onclick="showPage('sales',this)">💰 مبيعات</button>
    <button data-page="customers" onclick="showPage('customers',this)">👥 عملاء</button>
    <button data-page="suppliers" onclick="showPage('suppliers',this)">🏭 موردون</button>
    <button data-page="cash" onclick="showPage('cash',this)">💵 الخزينة</button>
    <button data-page="expenses" onclick="showPage('expenses',this)">📋 مصروفات</button>
    <button data-page="journal" onclick="showPage('journal',this)">📖 دفتر اليومية</button>
    <button data-page="ledger" onclick="showPage('ledger',this)">📚 دفتر الأستاذ</button>
    <button data-page="reports" onclick="showPage('reports',this)">📊 تقارير</button>
    <button data-page="backup" onclick="showPage('backup',this)">💾 نسخ احتياطي</button>
  </nav>

  <main id="page-content"></main>
</div>

<div id="printArea" style="display:none"></div>
<div id="syncIndicator" class="sync-status" style="display:none">☁️ متزامن</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, 
  onSnapshot, query, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { 
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDz6zwskT2aamqjFJ-0G-xvXhWBXDnGIMo",
  authDomain: "konter-app-11714.firebaseapp.com",
  projectId: "konter-app-11714",
  storageBucket: "konter-app-11714.firebasestorage.app",
  messagingSenderId: "1050620984001",
  appId: "1:1050620984001:web:adfb27aa62fadf0b1eb240"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const fmt = n => Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2});
const today = () => new Date().toISOString().split('T')[0];
window.openModal = id => document.getElementById(id).classList.add('active');
window.closeModal = id => document.getElementById(id).classList.remove('active');

const UNITS = ['لوح','كرتونة','كيس','كيلو','متر','متر مربع','قطعة','طقم','دستة','باكو'];
window.UNITS = UNITS;

// ===== شجرة الحسابات =====
const ACCOUNTS = {
  '1010': { name: 'الخزينة', type: 'asset', nature: 'debit' },
  '1020': { name: 'المخزون', type: 'asset', nature: 'debit' },
  '1030': { name: 'العملاء (مدينون)', type: 'asset', nature: 'debit' },
  '2010': { name: 'الموردون (دائنون)', type: 'liability', nature: 'credit' },
  '3010': { name: 'رأس المال', type: 'equity', nature: 'credit' },
  '4010': { name: 'المبيعات', type: 'revenue', nature: 'credit' },
  '5010': { name: 'تكلفة البضاعة المباعة', type: 'expense', nature: 'debit' },
  '5020': { name: 'المصروفات', type: 'expense', nature: 'debit' },
  '5030': { name: 'مرتجعات المبيعات', type: 'revenue', nature: 'debit' },
  '5040': { name: 'مرتجعات المشتريات', type: 'expense', nature: 'credit' }
};
window.ACCOUNTS = ACCOUNTS;

window.appData = { 
  categories: [], products: [], customers: [], suppliers: [], 
  journal_entries: [], journal_lines: [], cash: [], expenses: []
};
window.listeners = [];
window.currentCategoryId = null;
window.currentCustomerId = null;
window.currentSupplierId = null;
window.currentLedgerAccount = null;

function showSync(text, type='syncing'){
  const el = document.getElementById('syncIndicator');
  el.style.display = 'block';
  el.textContent = text;
  el.className = 'sync-status' + (type==='offline'?' offline':type==='syncing'?' syncing':'');
  if(type==='ok') setTimeout(()=>{ el.style.display='none'; }, 1500);
}
window.showSync = showSync;

/* ============ تسجيل الدخول ============ */
window.doLogin = async function(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-err');
  const btn = document.getElementById('login-btn');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'أدخل الإيميل وكلمة المرور'; return; }
  btn.disabled = true;
  btn.textContent = 'جاري الدخول...';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e){
    let msg = 'خطأ في الدخول';
    if(e.code === 'auth/user-not-found') msg = 'الإيميل غير مسجل';
    else if(e.code === 'auth/wrong-password') msg = 'كلمة المرور خطأ';
    else if(e.code === 'auth/invalid-email') msg = 'الإيميل غير صحيح';
    else if(e.code === 'auth/invalid-credential') msg = 'بيانات الدخول خطأ';
    else if(e.code === 'auth/too-many-requests') msg = 'محاولات كثيرة';
    errEl.textContent = msg;
  } finally {
    btn.disabled = false;
    btn.textContent = 'دخول';
  }
};

window.doLogout = async function(){
  if(!confirm('تسجيل الخروج؟')) return;
  await signOut(auth);
};

onAuthStateChanged(auth, async (user) => {
  const loadingEl = document.getElementById('loading-screen');
  const loginEl = document.getElementById('login-screen');
  const mainEl = document.getElementById('main-screen');
  loadingEl.classList.add('hidden');
  if(user){
    document.getElementById('user-email').textContent = user.email;
    loginEl.classList.add('hidden');
    mainEl.classList.add('active');
    await initRealtimeListeners();
    showPage('dashboard');
  } else {
    loginEl.classList.remove('hidden');
    mainEl.classList.remove('active');
    window.listeners.forEach(u => u());
    window.listeners = [];
  }
});

async function initRealtimeListeners(){
  showSync('☁️ جاري التحميل...', 'syncing');
  const collections = ['categories','products','customers','suppliers','journal_entries','journal_lines','cash','expenses'];
  let loadedCount = 0;
  collections.forEach(colName => {
    const q = query(collection(db, colName));
    const unsub = onSnapshot(q, (snap) => {
      window.appData[colName] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      loadedCount++;
      if(loadedCount <= collections.length) showSync('☁️ متزامن', 'ok');
      const activePage = document.querySelector('.main-nav button.active');
      if(activePage){
        const pageName = activePage.dataset.page;
        if(pageName && window['render_'+pageName]){
          const content = document.getElementById('page-content');
          window['render_'+pageName](content);
        }
      }
    }, (err) => {
      console.error('Sync error:', colName, err);
      showSync('⚠️ خطأ في المزامنة', 'offline');
    });
    window.listeners.push(unsub);
  });
}

window.dbAdd = async function(colName, data){
  data.createdAt = serverTimestamp();
  data.updatedAt = serverTimestamp();
  const ref = await addDoc(collection(db, colName), data);
  return ref.id;
};

window.dbUpdate = async function(colName, id, data){
  data.updatedAt = serverTimestamp();
  await updateDoc(doc(db, colName, id), data);
};

window.dbDelete = async function(colName, id){
  await deleteDoc(doc(db, colName, id));
};

window.dbGetAll = function(colName){ return window.appData[colName] || []; };

// ترتيب
window.sortByDateDesc = function(arr, field='date'){
  return arr.slice().sort((a,b) => {
    const da = new Date(a[field] || 0).getTime();
    const db2 = new Date(b[field] || 0).getTime();
    if(db2 !== da) return db2 - da;
    return (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0);
  });
};
window.sortByDateAsc = function(arr, field='date'){
  return arr.slice().sort((a,b) => {
    const da = new Date(a[field] || 0).getTime();
    const db2 = new Date(b[field] || 0).getTime();
    if(da !== db2) return da - db2;
    return (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0);
  });
};

// ===== توليد رقم الفاتورة (نسخة محسّنة) =====
window.genInvoiceNo = function(prefix, colName, field='reference'){
  const items = window.appData[colName] || [];
  let max = 0;
  const regex = new RegExp('^' + prefix + '-(\\d{1,6})$');
  items.forEach(i => {
    const val = String(i[field] || '');
    const m = val.match(regex);
    if(m){
      const num = +m[1];
      if(num > max) max = num;
    }
  });
  return `${prefix}-${String(max+1).padStart(4,'0')}`;
};

/* ============ المحرك المحاسبي ============ */
window.createJournalEntry = async function(opts){
  const { date, reference, description, lines } = opts;
  
  const totalDebit = lines.reduce((a, l) => a + (+l.debit || 0), 0);
  const totalCredit = lines.reduce((a, l) => a + (+l.credit || 0), 0);
  const balanced = Math.abs(totalDebit - totalCredit) < 0.01;
  
  if(!balanced){
    throw new Error(`القيد غير متوازن: مدين=${fmt(totalDebit)} دائن=${fmt(totalCredit)}`);
  }
  
  const entryId = await dbAdd('journal_entries', {
    date, reference, description,
    total_debit: totalDebit,
    total_credit: totalCredit,
    is_balanced: balanced
  });
  
  for(const line of lines){
    await dbAdd('journal_lines', {
      entry_id: entryId,
      account_code: line.account_code,
      account_name: line.account_name || ACCOUNTS[line.account_code]?.name || '',
      debit: +line.debit || 0,
      credit: +line.credit || 0,
      description: line.description || description,
      date: date,
      reference: reference
    });
  }
  
  return { entry_id: entryId, balanced, total_debit: totalDebit, total_credit: totalCredit };
};

window.reverseJournalEntry = async function(entryId, reason='عكس قيد'){
  const entry = dbGet('journal_entries', entryId);
  if(!entry) throw new Error('القيد غير موجود');
  
  const lines = dbGetAll('journal_lines').filter(l => l.entry_id === entryId);
  const reversedLines = lines.map(l => ({
    account_code: l.account_code,
    account_name: l.account_name,
    debit: l.credit,
    credit: l.debit,
    description: `${reason} - ${l.description}`
  }));
  
  return await createJournalEntry({
    date: today(),
    reference: `REV-${entry.reference}`,
    description: `${reason} للقيد ${entry.reference}`,
    lines: reversedLines
  });
};

window.getAccountBalance = function(accountCode){
  const lines = dbGetAll('journal_lines').filter(l => l.account_code === accountCode);
  const totalDebit = lines.reduce((a, l) => a + (+l.debit || 0), 0);
  const totalCredit = lines.reduce((a, l) => a + (+l.credit || 0), 0);
  const account = ACCOUNTS[accountCode];
  
  if(!account) return { balance: 0, debit: totalDebit, credit: totalCredit };
  
  let balance = 0;
  if(account.nature === 'debit'){
    balance = totalDebit - totalCredit;
  } else {
    balance = totalCredit - totalDebit;
  }
  
  return { 
    balance, 
    debit: totalDebit, 
    credit: totalCredit,
    name: account.name,
    type: account.type,
    nature: account.nature
  };
};

window.getAllAccountBalances = function(){
  const result = {};
  for(const code in ACCOUNTS){
    result[code] = getAccountBalance(code);
  }
  return result;
};

window.checkTrialBalance = function(){
  const balances = getAllAccountBalances();
  let totalDebit = 0, totalCredit = 0;
  for(const code in balances){
    const b = balances[code];
    if(b.balance > 0){
      if(b.nature === 'debit') totalDebit += b.balance;
      else totalCredit += b.balance;
    } else if(b.balance < 0){
      if(b.nature === 'debit') totalCredit += Math.abs(b.balance);
      else totalDebit += Math.abs(b.balance);
    }
  }
  return {
    totalDebit,
    totalCredit,
    balanced: Math.abs(totalDebit - totalCredit) < 0.01,
    difference: totalDebit - totalCredit
  };
};

window.savePurchase = async function(){
  const sid = document.getElementById('pu_sup').value;
  const d = document.getElementById('pu_date').value;
  if(!sid){ alert('اختر المورد'); return; }
  
  const lines = [];
  document.querySelectorAll('.pu-line').forEach(l => {
    const pid = l.querySelector('.ln-p').value;
    const q = +l.querySelector('.ln-q').value;
    const r = +l.querySelector('.ln-r').value;
    if(pid && q > 0) lines.push({ product_id: pid, quantity: q, unit_price: r, total: q*r });
  });
  if(!lines.length){ alert('أضف أصنافاً'); return; }
  
  const total = lines.reduce((a,l) => a + l.total, 0);
  const paid = +document.getElementById('pu_paid').value || 0;
  const rem = total - paid;
  const inv = document.getElementById('pu_no').value;
  const supplier = dbGet('suppliers', sid);
  
  showSync('☁️ جاري الحفظ...', 'syncing');
  
  try {
    const journalLines = [
      { account_code: '1020', debit: total, credit: 0, description: `شراء بضاعة ${inv}` }
    ];
    if(paid > 0){
      journalLines.push({ account_code: '1010', debit: 0, credit: paid, description: `دفعة نقدية ${inv}` });
    }
    if(rem > 0){
      journalLines.push({ account_code: '2010', debit: 0, credit: rem, description: `مستحق للمورد ${supplier?.name||''}` });
    }
    
    await createJournalEntry({
      date: d,
      reference: inv,
      description: `فاتورة شراء من ${supplier?.name||''}`,
      lines: journalLines
    });
    
    for(const l of lines){
      const p = dbGet('products', l.product_id);
      if(p){
        const oldStock = p.current_stock || 0;
        const oldValue = oldStock * (p.avg_cost || 0);
        const newValue = l.quantity * l.unit_price;
        const ns = oldStock + l.quantity;
        const newAvg = ns > 0 ? (oldValue + newValue) / ns : l.unit_price;
        await dbUpdate('products', p.id, {
          current_stock: ns,
          avg_cost: newAvg,
          purchase_price: l.unit_price
        });
      }
    }
    
    if(paid > 0){
      await dbAdd('cash', {
        date: d,
        type: 'out',
        amount: paid,
        source: 'مشتريات',
        reference: inv,
        description: `دفعة شراء ${inv}`
      });
    }
    
    showSync('✅ تم الحفظ', 'ok');
    closeModal('purchaseModal');
    showPage('purchases');
  } catch(err){
    showSync('❌ خطأ', 'offline');
    alert('خطأ في الحفظ: ' + err.message);
  }
};

window.saveSale = async function(){
  const cid = document.getElementById('sa_cus').value;
  const d = document.getElementById('sa_date').value;
  if(!cid){ alert('اختر العميل'); return; }
  
  const lines = [];
  let err = false;
  document.querySelectorAll('.sa-line').forEach(l => {
    const pid = l.querySelector('.ln-p').value;
    const q = +l.querySelector('.ln-q').value;
    const r = +l.querySelector('.ln-r').value;
    if(pid && q > 0) lines.push({ product_id: pid, quantity: q, unit_price: r, total: q*r });
  });
  if(!lines.length){ alert('أضف أصنافاً'); return; }
  
  for(const l of lines){
    const p = dbGet('products', l.product_id);
    if(!p || (p.current_stock||0) < l.quantity){
      alert(`الرصيد غير كافٍ: ${p?.name||''} (متاح ${fmt(p?.current_stock||0)})`);
      err = true; break;
    }
  }
  if(err) return;
  
  const total = lines.reduce((a,l) => a + l.total, 0);
  const paid = +document.getElementById('sa_paid').value || 0;
  const rem = total - paid;
  const inv = document.getElementById('sa_no').value;
  const customer = dbGet('customers', cid);
  
  let cogs = 0;
  for(const l of lines){
    const p = dbGet('products', l.product_id);
    cogs += (p?.avg_cost || 0) * l.quantity;
  }
  
  showSync('☁️ جاري الحفظ...', 'syncing');
  
  try {
    const journalLines = [];
    if(paid > 0){
      journalLines.push({ account_code: '1010', debit: paid, credit: 0, description: `تحصيل نقدي ${inv}` });
    }
    if(rem > 0){
      journalLines.push({ account_code: '1030', debit: rem, credit: 0, description: `مديونية ${customer?.name||''}` });
    }
    journalLines.push({ account_code: '4010', debit: 0, credit: total, description: `مبيعات ${inv}` });
    journalLines.push({ account_code: '5010', debit: cogs, credit: 0, description: `تكلفة مبيعات ${inv}` });
    journalLines.push({ account_code: '1020', debit: 0, credit: cogs, description: `خروج مخزون ${inv}` });
    
    await createJournalEntry({
      date: d,
      reference: inv,
      description: `فاتورة بيع للعميل ${customer?.name||''}`,
      lines: journalLines
    });
    
    for(const l of lines){
      const p = dbGet('products', l.product_id);
      if(p){
        await dbUpdate('products', p.id, {
          current_stock: (p.current_stock||0) - l.quantity
        });
      }
    }
    
    if(paid > 0){
      await dbAdd('cash', {
        date: d,
        type: 'in',
        amount: paid,
        source: 'مبيعات',
        reference: inv,
        description: `تحصيل بيع ${inv}`
      });
    }
    
    showSync('✅ تم الحفظ', 'ok');
    closeModal('saleModal');
    showPage('sales');
  } catch(err){
    showSync('❌ خطأ', 'offline');
    alert('خطأ في الحفظ: ' + err.message);
  }
};

window.getCustomerBalance = function(customerName){
  const lines = dbGetAll('journal_lines').filter(l => 
    l.account_code === '1030' && l.description && l.description.includes(customerName)
  );
  const debit = lines.reduce((a, l) => a + (+l.debit || 0), 0);
  const credit = lines.reduce((a, l) => a + (+l.credit || 0), 0);
  return debit - credit;
};

window.saveCustomerAction = async function(){
  const type = document.getElementById('ca_type').value;
  const date = document.getElementById('ca_date').value;
  const amount = +document.getElementById('ca_amount').value;
  const desc = document.getElementById('ca_desc').value;
  const cust = dbGet('customers', window.currentCustomerId);
  if(!cust) return;
  if(!amount || amount <= 0){ alert('أدخل مبلغاً'); return; }
  
  showSync('☁️ جاري الحفظ...', 'syncing');
  
  try {
    const ref = genInvoiceNo('ADJ', 'journal_entries', 'reference');
    let lines = [];
    
    if(type === 'payment'){
      lines = [
        { account_code: '1010', debit: amount, credit: 0, description: `تحصيل من ${cust.name}` },
        { account_code: '1030', debit: 0, credit: amount, description: `${cust.name} - تحصيل` }
      ];
      await dbAdd('cash', {
        date, type: 'in', amount, source: 'تحصيل عميل', reference: cust.name,
        description: desc || `تحصيل من ${cust.name}`
      });
    } else if(type === 'adjustment'){
      const oldBalance = getCustomerBalance(cust.name);
      const diff = amount - oldBalance;
      if(diff === 0){ alert('الرصيد لم يتغير'); return; }
      if(diff > 0){
        lines = [
          { account_code: '1030', debit: diff, credit: 0, description: `${cust.name} - تسوية` },
          { account_code: '3010', debit: 0, credit: diff, description: `تسوية رصيد ${cust.name}` }
        ];
      } else {
        lines = [
          { account_code: '3010', debit: Math.abs(diff), credit: 0, description: `تسوية رصيد ${cust.name}` },
          { account_code: '1030', debit: 0, credit: Math.abs(diff), description: `${cust.name} - تسوية` }
        ];
      }
    }
    
    await createJournalEntry({
      date, reference: ref, description: desc || `حركة عميل ${cust.name}`, lines
    });
    
    showSync('✅ تم الحفظ', 'ok');
    closeModal('customerActionModal');
    showPage('customers');
  } catch(err){
    showSync('❌ خطأ', 'offline');
    alert(err.message);
  }

window.getSupplierBalance = function(supplierName){
  const lines = dbGetAll('journal_lines').filter(l => 
    l.account_code === '2010' && l.description && l.description.includes(supplierName)
  );
  const debit = lines.reduce((a, l) => a + (+l.debit || 0), 0);
  const credit = lines.reduce((a, l) => a + (+l.credit || 0), 0);
  return credit - debit;
};

window.openSupplierAction = function(type){
  const sup = dbGet('suppliers', window.currentSupplierId);
  if(!sup) return;
  document.getElementById('sadTitle').textContent = type === 'payment' ? '💵 دفعة للمورد' : '⚖️ تسوية';
  document.getElementById('sad_type').value = type;
  document.getElementById('sad_date').value = today();
  document.getElementById('sad_amount').value = '';
  document.getElementById('sad_desc').value = '';
  openModal('supplierActionModal');
};

window.saveSupplierAction = async function(){
  const type = document.getElementById('sad_type').value;
  const date = document.getElementById('sad_date').value;
  const amount = +document.getElementById('sad_amount').value;
  const desc = document.getElementById('sad_desc').value;
  const sup = dbGet('suppliers', window.currentSupplierId);
  if(!sup) return;
  if(!amount || amount <= 0){ alert('أدخل مبلغاً'); return; }
  
  showSync('☁️ جاري الحفظ...', 'syncing');
  
  try {
    const ref = genInvoiceNo('ADJ', 'journal_entries', 'reference');
    let lines = [];
    
    if(type === 'payment'){
      lines = [
        { account_code: '2010', debit: amount, credit: 0, description: `${sup.name} - دفعة` },
        { account_code: '1010', debit: 0, credit: amount, description: `دفعة إلى ${sup.name}` }
      ];
      await dbAdd('cash', {
        date, type: 'out', amount, source: 'دفعة مورد', reference: sup.name,
        description: desc || `دفعة إلى ${sup.name}`
      });
    } else if(type === 'adjustment'){
      const oldBalance = getSupplierBalance(sup.name);
      const diff = amount - oldBalance;
      if(diff === 0){ alert('الرصيد لم يتغير'); return; }
      if(diff > 0){
        lines = [
          { account_code: '2010', debit: 0, credit: diff, description: `${sup.name} - تسوية` },
          { account_code: '3010', debit: diff, credit: 0, description: `تسوية ${sup.name}` }
        ];
      } else {
        lines = [
          { account_code: '3010', debit: 0, credit: Math.abs(diff), description: `تسوية ${sup.name}` },
          { account_code: '2010', debit: Math.abs(diff), credit: 0, description: `${sup.name} - تسوية` }
        ];
      }
    }
    
    await createJournalEntry({
      date, reference: ref, description: desc || `حركة مورد ${sup.name}`, lines
    });
    
    showSync('✅ تم الحفظ', 'ok');
    closeModal('supplierActionModal');
    showPage('suppliers');
  } catch(err){
    showSync('❌ خطأ', 'offline');
    alert(err.message);
  }
};

window.exportData = async function(){
  const data = { _meta: { exported_at: new Date().toISOString(), version: 9 } };
  ['categories','products','customers','suppliers','journal_entries','journal_lines','cash','expenses'].forEach(k => {
    data[k] = dbGetAll(k);
  });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'konter-backup-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(url);
};

window.importData = async function(){
  const f = document.getElementById('importFile').files[0];
  if(!f){ alert('اختر ملفاً'); return; }
  if(!confirm('سيتم إضافة البيانات من الملف.')) return;
  const text = await f.text();
  const data = JSON.parse(text);
  showSync('☁️ جاري الاستيراد...', 'syncing');
  let count = 0;
  for(const k of ['categories','products','customers','suppliers','journal_entries','journal_lines','cash','expenses']){
    if(data[k] && Array.isArray(data[k])){
      for(const it of data[k]){
        const { id, ...rest } = it;
        await dbAdd(k, rest);
        count++;
      }
    }
  }
  showSync('✅ تم استيراد ' + count + ' سجل', 'ok');
  alert('تم استيراد ' + count + ' سجل');
};

/* ============ فحص وإصلاح ============ */
window.verifyAndFixAll = async function(){
  if(!confirm('سيتم:\n- فحص كل القيود\n- التأكد من التوازن\n- عرض تقرير\n\nمتابعة؟')) return;
  
  showSync('☁️ جاري الفحص...', 'syncing');
  
  const entries = dbGetAll('journal_entries');
  const lines = dbGetAll('journal_lines');
  let problems = [];
  
  for(const e of entries){
    const entryLines = lines.filter(l => l.entry_id === e.id);
    const debit = entryLines.reduce((a, l) => a + (+l.debit || 0), 0);
    const credit = entryLines.reduce((a, l) => a + (+l.credit || 0), 0);
    if(Math.abs(debit - credit) > 0.01){
      problems.push(`قيد ${e.reference} غير متوازن: مدين=${fmt(debit)} دائن=${fmt(credit)}`);
    }
  }
  
  const trial = checkTrialBalance();
  
  let msg = '📋 نتائج الفحص:\n\n';
  msg += `عدد القيود: ${entries.length}\n`;
  msg += `عدد السطور: ${lines.length}\n\n`;
  
  if(problems.length === 0){
    msg += '✅ كل القيود متوازنة\n\n';
  } else {
    msg += `⚠️ مشاكل (${problems.length}):\n` + problems.slice(0, 10).join('\n') + '\n\n';
  }
  
  msg += `ميزان المراجعة: ${trial.balanced ? '✅ متوازن' : '❌ غير متوازن'}\n`;
  msg += `مدين: ${fmt(trial.totalDebit)}\n`;
  msg += `دائن: ${fmt(trial.totalCredit)}\n`;
  
  showSync('✅ تم الفحص', 'ok');
  alert(msg);
};

/* ============ حذف ============ */
window.dangerDelete = async function(colName){
  const labels = {
    'journal_entries': 'القيود',
    'journal_lines': 'سطور القيود',
    'cash': 'حركات الخزينة',
    'customers': 'العملاء',
    'suppliers': 'الموردين',
    'products': 'الأصناف',
    'categories': 'الفئات',
    'expenses': 'المصروفات'
  };
  const label = labels[colName] || colName;
  const count = dbGetAll(colName).length;
  if(count === 0){ alert(`لا توجد ${label} للحذف`); return; }
  
  const answer = prompt(`⚠️ حذف كل ${label} (${count} عنصر)\n\nاكتب DELETE للتأكيد:`);
  if(answer !== 'DELETE'){ alert('ملغي'); return; }
  
  showSync('☁️ جاري الحذف...', 'syncing');
  
  // لو بنحذف قيود، نحذف السطور كمان
  if(colName === 'journal_entries'){
    const entryIds = dbGetAll('journal_entries').map(e => e.id);
    for(const line of dbGetAll('journal_lines')){
      if(entryIds.includes(line.entry_id)){
        await dbDelete('journal_lines', line.id);
      }
    }
  }
  
  for(const it of dbGetAll(colName)){
    try { await dbDelete(colName, it.id); } catch(e){ console.error(e); }
  }
  
  showSync(`✅ تم الحذف`, 'ok');
  alert(`تم حذف ${count} عنصر`);
  showPage('backup');
};

window.dangerDeleteAll = async function(){
  const answer = prompt('💥💥💥 حذف كل البيانات 💥💥💥\n\nاكتب DELETE ALL للتأكيد:');
  if(answer !== 'DELETE ALL'){ alert('ملغي'); return; }
  const answer2 = prompt('تأكيد أخير: اكتب نعم:');
  if(answer2 !== 'نعم'){ alert('ملغي'); return; }
  
  showSync('☁️ جاري الحذف...', 'syncing');
  
  const collections = ['categories','products','customers','suppliers','journal_entries','journal_lines','cash','expenses'];
  let total = 0;
  for(const colName of collections){
    for(const it of dbGetAll(colName)){
      try { await dbDelete(colName, it.id); total++; } catch(e){ console.error(e); }
    }
  }
  
  showSync('✅ تم الحذف', 'ok');
  alert(`تم حذف ${total} عنصر`);
  showPage('dashboard');
};
